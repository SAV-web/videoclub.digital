name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
    paths:
      # Solo se activa si cambian ficheros relevantes para el Worker
      - 'cloudflare/**'
      - 'scripts/build-seo-css.mjs'
      - 'src/css/**'
      - 'wrangler.toml'
  workflow_dispatch: # Permite lanzarlo manualmente desde GitHub

concurrency:
  group: cloudflare-worker
  cancel-in-progress: true # Si haces dos push rápidos, cancela el anterior

jobs:
  deploy-worker:
    name: Build & Deploy Edge Worker 🚀
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Setup Node.js 22 ⚙️
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install Dependencies 📦
        run: npm ci

      - name: Build SEO CSS 🎨
        # Regenera el CSS del edge (seo-card-v6.css + seo-card-css.js)
        # aunque en este workflow Wrangler bundlea los fuentes directamente,
        # es bueno tener el CSS actualizado para coherencia
        run: npm run build:seo-css

      - name: Deploy to Cloudflare Workers ⛅
        # Wrangler empaqueta cloudflare/worker.js y todos sus imports,
        # y lo despliega directamente usando la API de Cloudflare
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
