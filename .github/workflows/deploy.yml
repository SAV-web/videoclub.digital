name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ] # Se ejecuta cada vez que subes cambios a la rama main
  workflow_dispatch: # Permite ejecutar el despliegue manualmente desde la web de GitHub

# Cancela despliegues anteriores en curso si haces varios push rápidos seguidos
concurrency:
  group: "pages"
  cancel-in-progress: true

# Permisos necesarios para que la acción pueda escribir en Pages
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install SPA Dependencies
        run: npm install

      - name: Type Check SPA Project (Informativo)
        run: npm run check
        continue-on-error: true

      - name: Build SPA Project
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Install & Build Astro SEO Site (SSG)
        run: |
          cd seo-site
          npm install
          npm run check || true
          npx astro build
        env:
          NODE_OPTIONS: "--max-old-space-size=8192"
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Merge Astro SEO Artifacts into SPA dist
        run: |
          cp -R seo-site/dist/. ./dist/

      - name: Disable Jekyll
        run: touch ./dist/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist # Sube la carpeta construida unificada (SPA + Fichas SEO + Sitemaps)

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
