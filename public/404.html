<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Videoclub Digital</title>
  <script>
    (function () {
      var l = window.location;
      var pathname = l.pathname;
      var isRepoSubpath = pathname.startsWith('/videoclub.digital/');
      var repoPrefix = isRepoSubpath ? '/videoclub.digital' : '';
      var route = pathname.slice(repoPrefix.length);
      var query = l.search ? l.search.slice(1) : '';
      var hash = l.hash || '';

      var redirectUrl = repoPrefix + '/?_p=' + encodeURIComponent(route) +
        (query ? '&_q=' + encodeURIComponent(query) : '') +
        hash;

      window.location.replace(redirectUrl);
    })();
  </script>
</head>
<body>
</body>
</html>
