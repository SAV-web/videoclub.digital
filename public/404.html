<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>videoclub.digital</title>
  <script>
    // GitHub Pages SPA 404 Fallback: convierte rutas no encontradas en parámetros ?_p y ?_q
    var pathSegmentsToKeep = window.location.pathname.startsWith('/videoclub.digital') ? 1 : 0;
    var path = window.location.pathname.split('/').slice(1 + pathSegmentsToKeep).join('/');
    var search = window.location.search ? window.location.search.slice(1) : '';
    var hash = window.location.hash || '';
    var base = pathSegmentsToKeep > 0 ? '/videoclub.digital/' : '/';
    var redirectUrl = base + '?_p=/' + path + (search ? '&_q=' + encodeURIComponent(search) : '') + hash;
    window.location.replace(redirectUrl);
  </script>
</head>
<body></body>
</html>
